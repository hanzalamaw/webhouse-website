# Netlify Configuration File
# This file configures how Netlify builds and deploys your site

[build]
  # Since this is a static site with no build step, we can skip the build command
  # Netlify will serve your files directly from the repository root
  publish = "."

# Serve coming-soon.html for ALL URLs
# Status 200 = Internal rewrite (serves the file, URL stays the same)
# This means EVERY route will show coming-soon.html content

# Serve coming-soon.html for root path
[[redirects]]
  from = "/"
  to = "/coming-soon.html"
  status = 200

# Serve coming-soon.html for all other paths
# Static assets (CSS, JS, images) are automatically served first before redirects
[[redirects]]
  from = "/*"
  to = "/coming-soon.html"
  status = 200
  force = false

# Optional: Redirect www to non-www (adjust to your preference)
[[redirects]]
  from = "https://www.yourdomain.com/*"
  to = "https://yourdomain.com/:splat"
  status = 301
  force = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: SPA fallback if you add client-side routing later
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

